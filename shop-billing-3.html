<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kishorilal Amarchand Billing</title>
<style>
/* Palette: deep indigo accent on cool-slate neutrals; green = money, red = remove, amber = held/warn. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f4; --line:#d9dde4;
  --fg:#1c2029; --muted:#5b616e; --faint:#8a90a0;
  --accent:#3a4fd6; --accent-ink:#ffffff; --accent-soft:#e7eaff;
  --good:#1a7f4b; --good-soft:#e2f4ea; --bad:#c23b33; --bad-soft:#fbe7e5; --warn:#9a6b00; --warn-soft:#fbf1d8;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 20px rgba(20,24,40,.06);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Consolas","Courier New",monospace;
}
html[data-theme="dark"]{
  --bg:#13151b; --surface:#1b1e26; --surface-2:#232733; --line:#333847;
  --fg:#e9ebf0; --muted:#a3aab8; --faint:#737b8c;
  --accent:#6b7cf0; --accent-ink:#0c0e14; --accent-soft:#242a46;
  --good:#4cc485; --good-soft:#15291f; --bad:#ef6b61; --bad-soft:#2b1715; --warn:#e3b24a; --warn-soft:#2a2112;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:650;line-height:1.2}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}

#app{display:flex;flex-direction:column;min-height:100%}
header.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right))}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11.5px;color:var(--faint);letter-spacing:.03em}
.bar .spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--accent)}

nav.tabs{position:sticky;top:57px;z-index:19;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:6px max(10px,env(safe-area-inset-left)) 6px max(10px,env(safe-area-inset-right));-webkit-overflow-scrolling:touch}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;white-space:nowrap;font-weight:600;font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 44px max(16px,env(safe-area-inset-right))}
section[hidden]{display:none!important}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.grow{flex:1;min-width:0}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
label.fld input,label.fld select,.inp{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--fg)}
label.fld input:focus,label.fld select:focus,.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--fg);font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:var(--radius-sm);padding:10px 14px;font-weight:650}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;font-weight:600}
.btn.block{width:100%;justify-content:center;text-align:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px;font-size:13px}
.del{color:var(--bad)}

.sec-head{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.sec-head h2{font-size:18px}
.sec-head .spacer{flex:1}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--faint);text-align:center;padding:26px 10px;font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em}
.pill.sale{background:var(--good-soft);color:var(--good)}
.pill.ret{background:var(--bad-soft);color:var(--bad)}
.pill.exc{background:var(--accent-soft);color:var(--accent)}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner .spacer{flex:1}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

.bill-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:780px){.bill-grid{grid-template-columns:1fr}}
.billbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.prodpick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:8px}
.prodpick[hidden]{display:none}
.prodpick button{display:flex;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 11px;text-align:left;gap:10px;align-items:baseline}
.prodpick button:last-child{border-bottom:0}
.prodpick button:hover,.prodpick button.active{background:var(--surface-2)}
.prodpick button.active{box-shadow:inset 3px 0 0 var(--accent)}
.prodpick .pn{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prodpick .pp{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.prodpick .pd{color:var(--faint);font-size:11px}
.prodpick .add{color:var(--accent);font-weight:700}
.qtybox{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.qtybox button{border:0;background:var(--surface-2);color:var(--fg);width:30px;height:30px;font-size:17px;line-height:1;font-weight:700}
.qtybox button:hover{background:var(--accent-soft)}
.qtybox input{border:0;background:transparent;color:var(--fg);width:50px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;-moz-appearance:textfield;padding:0}
.qtybox input::-webkit-outer-spin-button,.qtybox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qtybox input:focus{outline:2px solid var(--accent-soft);border-radius:4px}
.cart-x{border:0;background:none;color:var(--bad);font-size:18px;line-height:1;padding:4px 6px}
.itemname{border:0;background:none;color:var(--fg);font-weight:600;padding:0;text-align:left;font-size:14px}
.itemname:hover{color:var(--accent);text-decoration:underline}

.paymodes{display:flex;gap:6px;margin-bottom:10px}
.paymodes button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:var(--radius-sm);padding:8px 4px;font-weight:650;font-size:13px}
.paymodes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.splitgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.splitgrid label{font-size:11px}

.totals{display:flex;flex-direction:column;gap:7px}
.totals .t{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.totals .t b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.totals .save b{color:var(--good)}
.totals .grand{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);margin-top:4px;padding-top:9px}
.totals .grand span{font-weight:700;font-size:15px}
.totals .grand b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--good)}
.disc-row{display:flex;gap:8px;align-items:flex-end}

.overlay{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.overlay[hidden]{display:none!important}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.modal.wide{max-width:560px}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.previewline{margin-top:4px;padding:11px 12px;background:var(--surface-2);border-radius:var(--radius-sm);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.previewline .net{color:var(--good);font-size:17px;font-weight:800}
.previewline.warn{color:var(--warn);background:var(--warn-soft)}
.savedchip{margin-top:-2px}
.listrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px}
.listrow .grow{min-width:0}
.listrow b{font-weight:700}

#receiptLayer{background:#fff;color:#000;border:1px solid var(--line);border-radius:var(--radius-sm);margin:0 auto}
#receipt{font-family:var(--mono);color:#000;background:#fff;padding:10px 12px;font-size:12px;line-height:1.5;width:300px;margin:0 auto}
#receipt.w58{width:220px;font-size:11px}
#receipt .c{text-align:center}
#receipt .shop{font-size:15px;font-weight:700;letter-spacing:.02em}
#receipt .rule{border-top:1px dashed #000;margin:6px 0}
#receipt .r{display:flex;justify-content:space-between;gap:8px}
#receipt .r span:last-child{text-align:right;white-space:nowrap}
#receipt .it{margin:3px 0}
#receipt .it .nm{word-break:break-word}
#receipt .rhead,#receipt .rrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:4px}
#receipt .rhead{font-weight:700;border-bottom:1px solid #000;padding-bottom:2px;margin-bottom:3px}
#receipt .rhead span,#receipt .rrow span{text-align:right}
#receipt .rhead span:first-child,#receipt .rrow span:first-child{text-align:left}
#receipt.w58 .rhead,#receipt.w58 .rrow{grid-template-columns:24px 1fr 1fr 1fr;gap:3px}
#receipt .tot{font-size:15px;font-weight:700}
#receipt .foot{margin-top:6px;font-size:11px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:80;opacity:0;transition:opacity .18s, transform .18s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}
.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px}
.stat.hero .v{color:var(--good)}
.subcard{border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:14px}
.subcard h3{font-size:14px;padding:11px 12px;border-bottom:1px solid var(--line)}

@media print{
  @page{margin:3mm}
  header.bar,nav.tabs,main,.toast,.no-print{display:none!important}
  body,html{background:#fff}
  body *{visibility:hidden}
  #receiptLayer,#receiptLayer *{visibility:visible}
  #receiptLayer{position:absolute;left:0;top:0;border:0;margin:0;width:auto}
  #receipt{width:auto;padding:0}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><b id="brandName">Kishorilal Amarchand</b><span>Billing</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="keysBtn" title="Keyboard shortcuts (?)">⌨ Keys</button>
    <button class="iconbtn" id="themeBtn" title="Toggle light / dark">◐ Theme</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="bill" aria-selected="true">New Bill</button>
    <button role="tab" data-tab="products" aria-selected="false">Products</button>
    <button role="tab" data-tab="codes" aria-selected="false">Codes</button>
    <button role="tab" data-tab="customers" aria-selected="false">Customers</button>
    <button role="tab" data-tab="staff" aria-selected="false">Staff</button>
    <button role="tab" data-tab="reports" aria-selected="false">Reports</button>
    <button role="tab" data-tab="dayclose" aria-selected="false">Day Close</button>
    <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>

  <main>
    <section id="tab-bill"></section>
    <section id="tab-products" hidden></section>
    <section id="tab-codes" hidden></section>
    <section id="tab-customers" hidden></section>
    <section id="tab-staff" hidden></section>
    <section id="tab-reports" hidden></section>
    <section id="tab-dayclose" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>
</div>

<div class="overlay" id="receiptOverlay" hidden>
  <div class="modal no-print" style="max-width:360px">
    <h3 id="receiptTitle">Bill saved</h3>
    <p class="hint" id="receiptMeta"></p>
    <div id="receiptLayer"><div id="receipt"></div></div>
    <div class="actions">
      <button class="btn ghost" id="rcClose">Close</button>
      <button class="btn" id="rcNew">New bill</button>
      <button class="btn primary" id="rcPrint">🖨 Print</button>
    </div>
  </div>
</div>

<div class="overlay" id="modalOverlay" hidden><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ===================== helpers ===================== */
var LS="shopbill_v2", LST="shopbill_theme", DRAFT="shopbill_draft_v2";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function inr(n){return Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function money(n){return "₹"+inr(n);}
function rn(n){n=Number(n||0);return n%1===0?n.toLocaleString("en-IN"):n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function qtyFmt(q){q=Number(q)||0;return q%1===0?String(q):q.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");}
function round2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100;}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show");},2600);}
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dshow(ts){var d=new Date(ts);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
function dtshow(ts){var d=new Date(ts);return dshow(ts)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

/* ===================== state ===================== */
var defaults={
  settings:{shopName:"Kishorilal Amarchand",line1:"",line2:"",city:"",gstin:"",phone:"",receiptWidth:"80",heading:"CASH MEMO",prefix:"KA-",nextNo:1,nextRx:1,footer:"Thank you! Please visit again.",round:true,departments:["Men","Women","Kids","Fabric"]},
  products:[],codes:[],customers:[],staff:[],bills:[],held:[],daymeta:{}
};
function defaultCodes(){return [{id:uid(),letter:"A",amount:100},{id:uid(),letter:"B",amount:50},{id:uid(),letter:"C",amount:500}];}
function migrate(d){
  d.settings=Object.assign({},defaults.settings,d.settings||{});
  if(!d.settings.shopName||d.settings.shopName==="My Shop")d.settings.shopName="Kishorilal Amarchand";
  if(!Array.isArray(d.settings.departments)||!d.settings.departments.length)d.settings.departments=["Men","Women","Kids","Fabric"];
  if(d.settings.nextRx==null)d.settings.nextRx=1;
  d.products=d.products||[];d.products.forEach(function(p){if(p.mrp==null)p.mrp=(p.price!=null?p.price:0);if(!p.department)p.department="";});
  if(!Array.isArray(d.codes))d.codes=defaultCodes();
  d.customers=d.customers||[];d.staff=d.staff||[];d.bills=d.bills||[];d.held=d.held||[];d.daymeta=d.daymeta||{};
  // backfill bills saved by older versions so they appear in the finder / returns / reports / day-close
  d.bills.forEach(function(b){
    if(!b.type)b.type="sale";
    if(!b.payMode)b.payMode="cash";
    var tot=(b.calc&&b.calc.total!=null)?b.calc.total:0;
    if(!b.pay)b.pay=(b.type==="sale"?{cash:round2(tot),upi:0,card:0}:{cash:0,upi:0,card:0});
    if(!b.rep){
      if(b.type==="sale")b.rep={sales:round2(tot),refund:0,discount:round2(((b.calc&&b.calc.discT)||0)+((b.calc&&b.calc.extra)||0)),pay:b.pay,refundPay:{cash:0,upi:0,card:0}};
      else if(b.type==="return")b.rep={sales:0,refund:round2(b.refundAmount||0),discount:0,pay:{cash:0,upi:0,card:0},refundPay:(b.refundMode?(function(){var o={cash:0,upi:0,card:0};o[b.refundMode]=round2(b.refundAmount||0);return o;})():{cash:round2(b.refundAmount||0),upi:0,card:0})};
      else b.rep={sales:0,refund:0,discount:0,pay:{cash:0,upi:0,card:0},refundPay:{cash:0,upi:0,card:0}};
    }
    if(b.items)b.items.forEach(function(it){if(!it.department)it.department="Uncategorized";});
  });
  return d;
}
function seedData(){
  var s=JSON.parse(JSON.stringify(defaults));
  s.products=[
    {id:uid(),name:"Sample — Mens Full Shirt",mrp:999,department:"Men"},
    {id:uid(),name:"Sample — Kurti",mrp:1499,department:"Women"},
    {id:uid(),name:"Sample — Fabric",mrp:0,department:"Fabric"}
  ];
  s.codes=defaultCodes();s.staff=[{id:uid(),name:"Owner"}];s._seed=true;
  return s;
}
function load(){try{var r=localStorage.getItem(LS);if(r)return migrate(JSON.parse(r));var old=localStorage.getItem("shopbill_v1");if(old)return migrate(JSON.parse(old));}catch(e){}return seedData();}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){toast("Could not save — storage blocked in this browser");}scheduleBackup();}
var S=load();

/* ===================== cart ===================== */
function freshCart(){return {custId:"",staffId:(S.staff[0]?S.staff[0].id:""),items:[],extraType:"amount",extraVal:0,payMode:"cash",splitCash:"",splitUpi:"",splitCard:""};}
var cart=freshCart();
var exchangeCtx=null; // {refInvNo, refId, returnedItems, returnedValue, custName, custPhone}

/* codes */
function findCode(key){key=String(key).toUpperCase();return S.codes.filter(function(c){return String(c.letter).toUpperCase()===key;})[0];}
function parseCode(raw){
  raw=(raw||"").trim();
  var letters=raw.replace(/[^A-Za-z]/g,"").toUpperCase();
  var numStr=raw.replace(/[^0-9.]/g,"");
  var res={letters:"",codeAmt:0,mrp:null,unknown:false};
  if(letters){res.letters=letters;var f=findCode(letters);if(f)res.codeAmt=f.amount;else res.unknown=true;res.mrp=(numStr===""?null:parseFloat(numStr));return res;}
  if(numStr===""){return res;}
  if(numStr.indexOf(".")===-1&&numStr.length>=2){var last=numStr.slice(-1),nf=findCode(last);if(nf){res.letters=last;res.codeAmt=nf.amount;res.mrp=parseFloat(numStr.slice(0,-1));return res;}}
  res.mrp=parseFloat(numStr);return res;
}
function lineNet(it){var dt=it.discType||"amount",dv=(it.discVal!=null?it.discVal:(it.discount||0));var net=dt==="percent"?it.mrp*(1-(Number(dv)||0)/100):it.mrp-(Number(dv)||0);return Math.max(0,net);}
function compute(c){
  var mrpT=0,discT=0,qtyC=0;
  var lines=c.items.map(function(it){
    var net=lineNet(it),applied=it.mrp-net,amount=net*it.qty;
    mrpT+=it.mrp*it.qty;discT+=applied*it.qty;qtyC+=it.qty;
    return {name:it.name,code:it.code||"",mrp:it.mrp,discount:applied,discPct:(it.discType==="percent"?it.discVal:null),qty:it.qty,net:net,amount:amount,department:it.department||"Uncategorized"};
  });
  var sub0=mrpT-discT;
  var extra=c.extraVal?(c.extraType==="percent"?sub0*(Number(c.extraVal)||0)/100:(Number(c.extraVal)||0)):0;
  if(extra>sub0)extra=sub0;if(extra<0||isNaN(extra))extra=0;
  var goods=sub0-extra;                 // value of goods before exchange credit
  var credit=exchangeCtx?exchangeCtx.returnedValue:0;
  var net=goods-credit;                 // what's owed (can be negative = refund)
  var total,roundOff=0;
  if(S.settings.round){total=Math.round(net);roundOff=total-net;}else total=net;
  return {lines:lines,mrpT:mrpT,discT:discT,extra:extra,goods:goods,credit:credit,net:net,total:total,roundOff:roundOff,itemCount:lines.length,qtyC:qtyC};
}

/* searchable combo */
function setupCombo(inputId,listId,getItems,getSelectedId,onSelect,placeholder){
  var inp=$("#"+inputId),list=$("#"+listId);if(!inp||!list)return;
  function displayFor(id){var it=getItems().filter(function(x){return x.id===id;})[0];return it?it.label:"";}
  function sync(){inp.value=displayFor(getSelectedId());}
  function render(q){q=(q||"").toLowerCase();
    var ex=getItems().filter(function(x){return x.id===""&&(!q||x.label.toLowerCase().indexOf(q)>-1);});
    var items=getItems().filter(function(x){return x.id!==""&&(!q||x.label.toLowerCase().indexOf(q)>-1);});
    var all=ex.concat(items);
    if(!all.length){list.innerHTML='<div class="empty" style="padding:9px 11px;text-align:left">No match</div>';return;}
    list.innerHTML=all.slice(0,60).map(function(x,i){return '<button data-id="'+esc(x.id)+'"'+(i===0?' class="active"':'')+'>'+esc(x.label)+'</button>';}).join("");
    $$("#"+listId+" button").forEach(function(b){b.onmousedown=function(e){e.preventDefault();pick(b.getAttribute("data-id"));};});
  }
  function pick(id){onSelect(id);sync();list.hidden=true;}
  inp.onfocus=function(){render("");list.hidden=false;inp.select();};
  inp.oninput=function(){render(inp.value);list.hidden=false;};
  inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();var f=list.querySelector("button[data-id]");if(f)pick(f.getAttribute("data-id"));else list.hidden=true;}else if(e.key==="Escape"){sync();list.hidden=true;}};
  inp.onblur=function(){setTimeout(function(){list.hidden=true;sync();},150);};
  if(placeholder)inp.placeholder=placeholder;sync();
}

  var needPay=!exchangeCtx||c.total>0;
  pm.parentNode.style.display=needPay?"":"none";
  $$("#payModes button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-m")===cart.payMode?"true":"false");b.onclick=function(){cart.payMode=b.getAttribute("data-m");saveDraft();renderPayment();};});
  var sw=$("#splitWrap");
  if(cart.payMode==="split"){
    var total=Math.abs(c.total);
    var cashV=parseFloat(cart.splitCash)||0,upiV=parseFloat(cart.splitUpi)||0,cardV=parseFloat(cart.splitCard)||0;
    var rem=round2(total-cashV-upiV-cardV);
    sw.innerHTML='<div class="splitgrid"><label class="fld"><span>Cash ₹</span><input id="spCash" type="text" inputmode="decimal" autocomplete="off" value="'+(cart.splitCash||"")+'"></label><label class="fld"><span>UPI ₹</span><input id="spUpi" type="text" inputmode="decimal" autocomplete="off" value="'+(cart.splitUpi||"")+'"></label><label class="fld"><span>Card ₹</span><input id="spCard" type="text" inputmode="decimal" autocomplete="off" value="'+(cart.splitCard||"")+'"></label></div><p class="hint" style="margin-top:-4px">'+(Math.abs(rem)<0.5?'<b style="color:var(--good)">Split matches the total ✓</b>':('Remaining to assign: <b style="color:var(--bad)">'+money(rem)+'</b>'))+'</p>';
    $("#spCash").oninput=function(){cart.splitCash=this.value;saveDraft();renderPayment();};
    $("#spUpi").oninput=function(){cart.splitUpi=this.value;saveDraft();renderPayment();};
    $("#spCard").oninput=function(){cart.splitCard=this.value;saveDraft();renderPayment();};
  }else sw.innerHTML="";
}

function billPayObject(total){
  if(cart.payMode==="split"){return {cash:round2(parseFloat(cart.splitCash)||0),upi:round2(parseFloat(cart.splitUpi)||0),card:round2(parseFloat(cart.splitCard)||0)};}
  var o={cash:0,upi:0,card:0};o[cart.payMode]=round2(total);return o;
}

function saveBill(){
  var c=compute(cart);
  if(exchangeCtx){ completeExchange(c); return; }
  if(!cart.items.length){toast("Add at least one item");return;}
  var st=S.settings;
  if(cart.payMode==="split"){var tot=c.total,sum=(parseFloat(cart.splitCash)||0)+(parseFloat(cart.splitUpi)||0)+(parseFloat(cart.splitCard)||0);if(Math.abs(round2(tot-sum))>=0.5){toast("Split amounts must add up to "+money(tot));return;}}
  var go=function(){
    var cust=S.customers.filter(function(x){return x.id===cart.custId;})[0];
    var stf=S.staff.filter(function(x){return x.id===cart.staffId;})[0];
    var invNo=st.prefix+String(st.nextNo).padStart(4,"0");
    var pay=billPayObject(c.total);
    var bill={id:uid(),invNo:invNo,ts:new Date().toISOString(),type:"sale",
      custId:cart.custId,custName:cust?cust.name:"Walk-in customer",custPhone:cust?cust.phone:"",
      staffId:cart.staffId,staffName:stf?stf.name:"",items:c.lines,payMode:cart.payMode,pay:pay,
      calc:{mrpT:round2(c.mrpT),discT:round2(c.discT),extra:round2(c.extra),total:round2(c.total),roundOff:round2(c.roundOff),qtyC:c.qtyC,itemCount:c.itemCount},
      rep:{sales:round2(c.total),refund:0,discount:round2(c.discT+c.extra),pay:pay,refundPay:{cash:0,upi:0,card:0}}};
    S.bills.push(bill);st.nextNo+=1;delete S._seed;save();
    cart=freshCart();showReceipt(bill,true);renderers.bill();
  };
  if(!cart.staffId&&S.staff.length){confirmDlg({title:"No staff selected",body:"Save this bill without a staff name?",ok:"Save anyway"}).then(function(ok){if(ok)go();});}else go();
}

/* ===================== HOLD / RECALL ===================== */
function holdCurrent(){
  if(!cart.items.length){toast("Nothing to hold");return;}
  if(exchangeCtx){toast("Finish or cancel the exchange first");return;}
  var cust=S.customers.filter(function(x){return x.id===cart.custId;})[0];
  var def=cust?cust.name:("Bill "+(S.held.length+1));
  openModal('<h3>Hold this bill</h3><label class="fld" style="margin-top:12px"><span>Label (to find it later)</span><input id="hlLabel" value="'+esc(def)+'"></label><div class="actions"><button class="btn ghost" id="hlCancel">Cancel</button><button class="btn warn" id="hlSave">Hold</button></div>');
  $("#hlLabel").focus();$("#hlLabel").select();
  $("#hlCancel").onclick=closeModal;
  $("#hlSave").onclick=function(){var lab=$("#hlLabel").value.trim()||def;var c=compute(cart);S.held.push({id:uid(),ts:new Date().toISOString(),label:lab,total:round2(c.total),items:c.itemCount,cart:JSON.parse(JSON.stringify(cart))});save();cart=freshCart();closeModal();renderers.bill();toast("Bill held");};
  $("#hlLabel").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();$("#hlSave").click();}};
}
function heldList(){
  if(!S.held.length){openModal('<h3>Held bills</h3><div class="empty">No held bills.</div><div class="actions"><button class="btn primary" id="hClose">Close</button></div>');$("#hClose").onclick=closeModal;return;}
  var rows=S.held.slice().reverse().map(function(h){return '<div class="listrow"><div class="grow"><b>'+esc(h.label)+'</b><div class="hint">'+h.items+' items · '+money(h.total)+' · '+dtshow(h.ts)+'</div></div><button class="btn sm primary" data-rec="'+h.id+'">Recall</button><button class="btn sm ghost del" data-del="'+h.id+'">Delete</button></div>';}).join("");
  openModal('<h3>Held bills ('+S.held.length+')</h3><div style="margin-top:12px">'+rows+'</div><div class="actions"><button class="btn primary" id="hClose">Close</button></div>',true);
  $("#hClose").onclick=closeModal;
  $$("#modalBox [data-rec]").forEach(function(b){b.onclick=function(){recallHeld(b.getAttribute("data-rec"));};});
  $$("#modalBox [data-del]").forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-del");confirmDlg({title:"Delete held bill?",ok:"Delete",danger:true}).then(function(ok){if(ok){S.held=S.held.filter(function(x){return x.id!==id;});save();closeModal();heldList();}});};});
}
function recallHeld(id){
  var h=S.held.filter(function(x){return x.id===id;})[0];if(!h)return;
  var doRecall=function(){S.held=S.held.filter(function(x){return x.id!==id;});cart=JSON.parse(JSON.stringify(h.cart));cart.payMode=cart.payMode||"cash";save();closeModal();show("bill");toast("Bill recalled");};
  if(cart.items.length){chooseDlg("You have an open bill","Hold the current bill before recalling this one?",[{label:"Cancel",value:0},{label:"Hold current & recall",value:1,kind:"primary"}]).then(function(v){if(v===1){var cust=S.customers.filter(function(x){return x.id===cart.custId;})[0];var c=compute(cart);S.held.push({id:uid(),ts:new Date().toISOString(),label:(cust?cust.name:"Bill "+(S.held.length+1)),total:round2(c.total),items:c.itemCount,cart:JSON.parse(JSON.stringify(cart))});doRecall();}});}
  else doRecall();
}

/* ===================== RECEIPT ===================== */
function receiptHTML(b){
  var st=S.settings;
  function r(a,c){return '<div class="r"><span>'+a+'</span><span>'+c+'</span></div>';}
  var heading=b.type==="return"?"RETURN / REFUND":(b.type==="exchange"?"EXCHANGE":(st.heading||"CASH MEMO"));
  var h='<div class="c"><div class="shop">'+esc(st.shopName||"Shop")+'</div>';
  if(st.line1)h+='<div>'+esc(st.line1)+'</div>';
  if(st.line2)h+='<div>'+esc(st.line2)+'</div>';
  if(st.city)h+='<div>'+esc(st.city)+'</div>';
  if(st.phone)h+='<div>Ph: '+esc(st.phone)+'</div>';
  if(st.gstin)h+='<div>GSTIN: '+esc(st.gstin)+'</div>';
  h+='</div><div class="rule"></div><div class="c" style="font-weight:700;letter-spacing:.05em">'+heading+'</div>';
  var d=new Date(b.ts);
  h+=r("Bill: "+esc(b.invNo),dshow(b.ts)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"));
  if(b.refInvNo)h+=r("Against:",esc(b.refInvNo));
  if(b.custName&&b.custName!=="Walk-in customer"){h+=r("Customer:",esc(b.custName));if(b.custPhone)h+=r("Phone:",esc(b.custPhone));}
  if(b.staffName)h+=r("Staff:",esc(b.staffName));

  function itemsBlock(items,headline){
    var s="";
    if(headline)s+='<div class="rule"></div><div style="font-weight:700">'+headline+'</div>';
    s+='<div class="rhead"><span>Qty</span><span>MRP</span><span>Disc</span><span>Sale</span></div>';
    items.forEach(function(it){
      var mrp=it.mrp!=null?it.mrp:(it.rate!=null?it.rate:0);
      var net=it.net!=null?it.net:Math.max(0,mrp-(it.discount||0));
      var disc=it.discount!=null?it.discount:(mrp-net);
      var amount=it.amount!=null?it.amount:net*it.qty;
      s+='<div class="it"><div class="nm">'+esc(it.name)+(it.code?' ['+esc(it.code)+']':"")+'</div><div class="rrow"><span>'+qtyFmt(it.qty)+'</span><span>'+rn(mrp)+'</span><span>'+(disc>0?"-"+rn(disc):"-")+'</span><span>'+rn(amount)+'</span></div></div>';
    });
    return s;
  }

  if(b.type==="return"){
    h+=itemsBlock(b.items,"Returned");
    h+='<div class="rule"></div>'+r("Refund ("+esc((b.refundMode||"cash").toUpperCase())+")","Rs "+rn(b.refundAmount));
    h+='<div class="rule"></div>';
  }else if(b.type==="exchange"){
    h+=itemsBlock(b.returnedItems,"Returned");
    h+=itemsBlock(b.newItems,"New items");
    h+='<div class="rule"></div>'+r("New items",( "Rs "+rn(b.newValue)));
    h+=r("Return credit","- Rs "+rn(b.returnedValue));
    if(b.diff>=0)h+='<div class="r tot"><span>CUSTOMER PAYS ('+esc((b.settleMode||"cash").toUpperCase())+')</span><span>Rs '+rn(b.diff)+'</span></div>';
    else h+='<div class="r tot"><span>REFUND ('+esc((b.settleMode||"cash").toUpperCase())+')</span><span>Rs '+rn(-b.diff)+'</span></div>';
    h+='<div class="rule"></div>';
  }else{
    h+=itemsBlock(b.items,null);
    h+='<div class="rule"></div>';
    var mrpT=b.calc.mrpT!=null?b.calc.mrpT:b.calc.total, discT=b.calc.discT||0, extra=b.calc.extra||0;
    if(discT>0||extra>0)h+=r("Total MRP","Rs "+rn(mrpT));
    if(discT>0)h+=r("Item discount","- Rs "+rn(discT));
    if(extra>0)h+=r("Extra discount","- Rs "+rn(extra));
    if(Math.abs(b.calc.roundOff||0)>=0.005)h+=r("Round off",((b.calc.roundOff>=0?"+ ":"- ")+"Rs "+rn(Math.abs(b.calc.roundOff))));
    h+='<div class="rule"></div><div class="r tot"><span>TOTAL</span><span>Rs '+rn(b.calc.total)+'</span></div>';
    h+=r("Paid by",payText(b.pay,b.payMode));
    h+=r("Items / Qty",b.calc.itemCount+" / "+qtyFmt(b.calc.qtyC));
    h+='<div class="rule"></div>';
  }
  if(st.footer)h+='<div class="c foot">'+esc(st.footer)+'</div>';
  return h;
}
function payText(pay,mode){
  if(!pay)return (mode||"Cash");
  if(mode==="split"||((pay.cash>0?1:0)+(pay.upi>0?1:0)+(pay.card>0?1:0))>1){
    var parts=[];if(pay.cash>0)parts.push("Cash "+rn(pay.cash));if(pay.upi>0)parts.push("UPI "+rn(pay.upi));if(pay.card>0)parts.push("Card "+rn(pay.card));return parts.join(", ");
  }
  if(pay.cash>0)return "Cash";if(pay.upi>0)return "UPI";if(pay.card>0)return "Card";return (mode||"Cash");
}
function showReceipt(b,autoprint){
  var rc=$("#receipt");rc.className=S.settings.receiptWidth==="58"?"w58":"";rc.innerHTML=receiptHTML(b);
  $("#receiptTitle").textContent=b.type==="return"?"Return saved":(b.type==="exchange"?"Exchange saved":"Bill saved");
  $("#receiptMeta").textContent=b.invNo+" · "+(b.type==="return"?("Refund "+money(b.refundAmount)):(b.type==="exchange"?(b.diff>=0?("Pay "+money(b.diff)):("Refund "+money(-b.diff))):money(b.calc.total)));
  $("#receiptOverlay").hidden=false;
  if(autoprint)setTimeout(function(){try{window.print();}catch(e){}},350);
}

$("#rcNew").onclick=function(){$("#receiptOverlay").hidden=true;show("bill");};

function billFinder(forReturn){
  openModal('<h3>'+(forReturn?"Return / Exchange — find the bill":"Find a bill")+'</h3><label class="fld" style="margin-top:12px"><span>Search by bill number, customer name, phone, or date (dd/mm)</span><input id="bfSearch" autocomplete="off" placeholder="KA-0007, Ramesh, 98xxxx, 30/10"></label><div id="bfResults" style="margin-top:12px;max-height:46vh;overflow:auto"></div><div class="actions"><button class="btn primary" id="bfClose">Close</button></div>',true);
  $("#bfClose").onclick=closeModal;
  var inp=$("#bfSearch");inp.oninput=function(){drawFinder(this.value,forReturn);};drawFinder("",forReturn);

function drawFinder(q,forReturn){
  q=(q||"").toLowerCase().trim();
  var list=S.bills.filter(function(b){return b.type==="sale";});
  if(q)list=list.filter(function(b){return b.invNo.toLowerCase().indexOf(q)>-1||(b.custName||"").toLowerCase().indexOf(q)>-1||(b.custPhone||"").indexOf(q)>-1||dshow(b.ts).indexOf(q)>-1;});
  list=list.slice().reverse().slice(0,40);
  var el=$("#bfResults");

  el.innerHTML=list.map(function(b){return '<div class="listrow"><div class="grow"><b>'+esc(b.invNo)+'</b> <span class="hint">'+dtshow(b.ts)+'</span><div class="hint">'+esc(b.custName||"Walk-in")+' · '+b.calc.itemCount+' items · '+money(b.calc.total)+'</div></div>'+(forReturn?'<button class="btn sm primary" data-ret="'+b.id+'">Return / Exchange</button>':'<button class="btn sm" data-view="'+b.id+'">View / Reprint</button>')+'</div>';}).join("");
  $$("#bfResults [data-view]").forEach(function(x){x.onclick=function(){var b=S.bills.filter(function(y){return y.id===x.getAttribute("data-view");})[0];if(b){closeModal();showReceipt(b,false);}};});
  $$("#bfResults [data-ret]").forEach(function(x){x.onclick=function(){var b=S.bills.filter(function(y){return y.id===x.getAttribute("data-ret");})[0];if(b)returnDialog(b);};});
}
function returnDialog(bill){
  var rows=bill.items.map(function(it,i){var net=it.net!=null?it.net:Math.max(0,it.mrp-(it.discount||0));return '<div class="listrow"><label class="chk" style="flex:1"><input type="checkbox" data-sel="'+i+'"> <span><b>'+esc(it.name)+'</b><div class="hint">sold '+qtyFmt(it.qty)+' × '+money(net)+'</div></span></label><label class="fld" style="width:80px"><span>Return qty</span><input data-rq="'+i+'" type="text" inputmode="decimal" value="'+qtyFmt(it.qty)+'"></label></div>';}).join("");
  openModal('<h3>Return / Exchange — '+esc(bill.invNo)+'</h3><p class="hint" style="margin-top:4px">Tick the items coming back and set the return quantity.</p><div style="margin-top:12px;max-height:40vh;overflow:auto">'+rows+'</div><div class="previewline" id="rtPrev" style="margin-top:12px">Select items to return</div><div class="actions"><button class="btn ghost" id="rtCancel">Cancel</button><button class="btn warn" id="rtRefund">Refund</button><button class="btn primary" id="rtExchange">Exchange →</button></div>',true);
  function selected(){var out=[];bill.items.forEach(function(it,i){var cb=$('#modalBox [data-sel="'+i+'"]');if(cb&&cb.checked){var rq=round2(parseFloat($('#modalBox [data-rq="'+i+'"]').value));if(isNaN(rq)||rq<=0)rq=it.qty;if(rq>it.qty)rq=it.qty;var net=it.net!=null?it.net:Math.max(0,it.mrp-(it.discount||0));out.push({name:it.name,code:it.code,mrp:it.mrp,discount:it.discount,net:net,qty:rq,amount:round2(net*rq),department:it.department||"Uncategorized"});}});return out;}
  function refreshRt(){var sel=selected();var val=sel.reduce(function(a,x){return a+x.amount;},0);var p=$("#rtPrev");if(!sel.length){p.className="previewline";p.textContent="Select items to return";}else{p.className="previewline";p.innerHTML="Returning "+sel.length+" item(s) — value <span class=\"net\">"+money(val)+"</span>";}return {sel:sel,val:round2(val)};}
  $$("#modalBox [data-sel],#modalBox [data-rq]").forEach(function(x){x.onchange=refreshRt;x.oninput=refreshRt;});
  $("#rtCancel").onclick=closeModal;
  $("#rtRefund").onclick=function(){var r=refreshRt();if(!r.sel.length){toast("Select items to return");return;}refundDialog(bill,r.sel,r.val);};
  $("#rtExchange").onclick=function(){var r=refreshRt();if(!r.sel.length){toast("Select items to return");return;}startExchange(bill,r.sel,r.val);};
  refreshRt();
}
function refundDialog(bill,items,value){
  openModal('<h3>Refund '+money(value)+'</h3><p class="hint" style="margin-top:4px">Against '+esc(bill.invNo)+' — '+items.length+' item(s).</p><label class="fld" style="margin-top:12px"><span>Refund by</span><select id="rfMode"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select></label><div class="actions"><button class="btn ghost" id="rfCancel">Back</button><button class="btn warn" id="rfDo">Refund &amp; print</button></div>');
  $("#rfCancel").onclick=function(){returnDialog(bill);};
  $("#rfDo").onclick=function(){
    var mode=$("#rfMode").value;var st=S.settings;var invNo="RET-"+String(st.nextRx).padStart(4,"0");
    var rp={cash:0,upi:0,card:0};rp[mode]=round2(value);
    var rec={id:uid(),invNo:invNo,ts:new Date().toISOString(),type:"return",refInvNo:bill.invNo,refId:bill.id,
      custName:bill.custName,custPhone:bill.custPhone,staffName:bill.staffName,items:items,refundAmount:round2(value),refundMode:mode,
      rep:{sales:0,refund:round2(value),discount:0,pay:{cash:0,upi:0,card:0},refundPay:rp}};
    S.bills.push(rec);st.nextRx+=1;save();closeModal();showReceipt(rec,true);
  };
}
function startExchange(bill,items,value){
  exchangeCtx={refInvNo:bill.invNo,refId:bill.id,returnedItems:items,returnedValue:round2(value),custName:bill.custName,custPhone:bill.custPhone,custId:bill.custId};
  cart=freshCart();cart.custId=bill.custId||"";
  closeModal();show("bill");toast("Add the new items for the exchange");
}
function completeExchange(c){
  if(!cart.items.length){toast("Add the new items for the exchange");return;}
  var st=S.settings;var diff=round2(c.total); // customer pays if >0 else refund
  var needPay=diff>0;
  if(needPay&&cart.payMode==="split"){var sum=(parseFloat(cart.splitCash)||0)+(parseFloat(cart.splitUpi)||0)+(parseFloat(cart.splitCard)||0);if(Math.abs(round2(diff-sum))>=0.5){toast("Split amounts must add up to "+money(diff));return;}}
  var settleMode=cart.payMode;
  var pay={cash:0,upi:0,card:0}, rp={cash:0,upi:0,card:0};
  if(diff>0){ pay=billPayObject(diff); }
  else if(diff<0){ rp[settleMode==="split"?"cash":settleMode]=round2(-diff); }
  var invNo="EXC-"+String(st.nextRx).padStart(4,"0");
  var newVal=round2(c.goods); // value of new goods after item+extra discount, before credit
  var rec={id:uid(),invNo:invNo,ts:new Date().toISOString(),type:"exchange",refInvNo:exchangeCtx.refInvNo,refId:exchangeCtx.refId,
    custName:exchangeCtx.custName,custPhone:exchangeCtx.custPhone,custId:exchangeCtx.custId||"",
    returnedItems:exchangeCtx.returnedItems,returnedValue:exchangeCtx.returnedValue,newItems:c.lines,newValue:newVal,
    diff:diff,settleMode:settleMode,payMode:settleMode,pay:pay,
    calc:{mrpT:round2(c.mrpT),discT:round2(c.discT),extra:round2(c.extra),total:diff,roundOff:round2(c.roundOff),qtyC:c.qtyC,itemCount:c.itemCount},
    rep:{sales:diff>0?diff:0,refund:diff<0?round2(-diff):0,discount:round2(c.discT+c.extra),pay:pay,refundPay:rp}};
  S.bills.push(rec);st.nextRx+=1;exchangeCtx=null;save();cart=freshCart();showReceipt(rec,true);renderers.bill();
}

function deptOptionsHtml(sel){var opts=S.settings.departments.concat(["Uncategorized"]);var seen={};return opts.filter(function(d){if(seen[d])return false;seen[d]=1;return true;}).map(function(d){return '<option value="'+esc(d)+'"'+(sel===d?" selected":"")+'>'+esc(d)+'</option>';}).join("");}
function drawProducts(q){
  q=(q||"").toLowerCase().trim();
  var list=S.products.filter(function(p){return !q||p.name.toLowerCase().indexOf(q)>-1;});

function rangeBills(){
  var now=new Date(),bills=S.bills;
  if(repRange==="today")return bills.filter(function(b){return dkey(new Date(b.ts))===dkey(now);});

  var f=$("#rFrom")&&$("#rFrom").value,t=$("#rTo")&&$("#rTo").value;

}
function soldItemsOf(b){ if(b.type==="sale")return b.items||[]; if(b.type==="exchange")return b.newItems||[]; return []; }

  });

  var billRows=bills.slice().sort(function(a,b){return new Date(b.ts)-new Date(a.ts);}).map(function(b){var amt=b.type==="return"?("− "+money(b.refundAmount)):(b.type==="exchange"?(b.diff>=0?money(b.diff):"− "+money(-b.diff)):money(b.calc.total));return '<tr><td>'+esc(b.invNo)+' '+typePill(b.type)+'</td><td>'+dtshow(b.ts)+'</td><td>'+esc(b.custName||"Walk-in")+'</td><td>'+esc(b.staffName||"—")+'</td><td class="num">'+amt+'</td><td class="num"><button class="linkbtn" data-v="'+b.id+'">View</button></td></tr>';}).join("")||'<tr><td colspan="6"><div class="empty">No bills in range.</div></td></tr>';

function csvParse(text){
  var rows=[],row=[],cur="",q=false,i=0,ch;text=String(text).replace(/\r\n?/g,"\n");
  for(;i<text.length;i++){ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;else if(ch===','){row.push(cur);cur="";}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur="";}else cur+=ch;}
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.length&&!(r.length===1&&r[0].trim()==="");});
}
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function download(name,text,type){try{var blob=new Blob([text],{type:type||"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},500);}catch(e){toast("Download failed in this browser");}}
function hdrIndex(header,names){header=header.map(function(h){return String(h).trim().toLowerCase();});for(var i=0;i<names.length;i++){var idx=header.indexOf(names[i]);if(idx>-1)return idx;}return -1;}

function exportProducts(){

  var out=["Name,MRP,Department"].concat(S.products.map(function(p){return [csvCell(p.name),csvCell(p.mrp||""),csvCell(p.department||"")].join(",");}));
  download("products_"+dkey()+".csv",out.join("\n"),"text/csv;charset=utf-8");toast("Products exported");
}
function importProducts(file){
  var rd=new FileReader();rd.onload=function(){
    var rows=csvParse(rd.result);if(rows.length<1){toast("Empty file");return;}
    var start=0,nameI=0,mrpI=1,depI=2;
    var h0=rows[0].map(function(x){return String(x).trim().toLowerCase();});
    if(h0.indexOf("name")>-1){start=1;nameI=hdrIndex(rows[0],["name","product","item"]);mrpI=hdrIndex(rows[0],["mrp","price","rate"]);depI=hdrIndex(rows[0],["department","dept","category"]);}
    var added=0,skipped=0;var seen={};S.products.forEach(function(p){seen[p.name.toLowerCase().trim()]=1;});
    for(var i=start;i<rows.length;i++){var r=rows[i];var nm=(r[nameI]||"").trim();if(!nm){continue;}var key=nm.toLowerCase();if(seen[key]){skipped++;continue;}seen[key]=1;var mrp=mrpI>-1?parseFloat(r[mrpI]):0;if(isNaN(mrp))mrp=0;var dp=depI>-1?(r[depI]||"").trim():"";S.products.push({id:uid(),name:nm,mrp:mrp,department:dp||"Uncategorized"});added++;}
    save();drawProducts($("#pSearch")?$("#pSearch").value:"");toast(added+" added, "+skipped+" skipped (already existed)");
  };rd.readAsText(file);
}

    for(var i=start;i<rows.length;i++){var r=rows[i];var nm=(r[nameI]||"").trim();if(!nm){continue;}var ph=phoneI>-1?(r[phoneI]||"").trim():"";if(ph&&phones[ph]){skipped++;continue;}if(ph)phones[ph]=1;S.customers.push({id:uid(),name:nm,phone:ph,gstin:gstI>-1?(r[gstI]||"").trim():"",address:addrI>-1?(r[addrI]||"").trim():""});added++;}

function saveDraft(){try{if(cart.items.length||exchangeCtx)localStorage.setItem(DRAFT,JSON.stringify({cart:cart,exchangeCtx:exchangeCtx}));else localStorage.removeItem(DRAFT);}catch(e){}}
function loadDraft(){try{var r=localStorage.getItem(DRAFT);if(r){var d=JSON.parse(r);if(d&&d.cart&&(d.cart.items&&d.cart.items.length||d.exchangeCtx)){cart=d.cart;cart.payMode=cart.payMode||"cash";if(d.exchangeCtx)exchangeCtx=d.exchangeCtx;}}}catch(e){}}

var fsSupported=(typeof window.showDirectoryPicker==="function");
var dirHandle=null, backupTimer=null;
function idbOpen(){return new Promise(function(res,rej){try{var rq=indexedDB.open("shopbill_fs",1);rq.onupgradeneeded=function(){rq.result.createObjectStore("h");};rq.onsuccess=function(){res(rq.result);};rq.onerror=function(){rej(rq.error);};}catch(e){rej(e);}});}
function idbGetHandle(){return idbOpen().then(function(db){return new Promise(function(res){try{var t=db.transaction("h","readonly").objectStore("h").get("dir");t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};}catch(e){res(null);}});}).catch(function(){return null;});}
function idbPutHandle(h){return idbOpen().then(function(db){return new Promise(function(res){try{var tx=db.transaction("h","readwrite");tx.objectStore("h").put(h,"dir");tx.oncomplete=function(){res();};tx.onerror=function(){res();};}catch(e){res();}});}).catch(function(){});}
function idbDelHandle(){return idbOpen().then(function(db){return new Promise(function(res){try{var tx=db.transaction("h","readwrite");tx.objectStore("h").delete("dir");tx.oncomplete=function(){res();};tx.onerror=function(){res();};}catch(e){res();}});}).catch(function(){});}
function stamp(){return dkey();}
function fsWrite(name,text){return (async function(){if(!dirHandle)return false;try{var fh=await dirHandle.getFileHandle(name,{create:true});var w=await fh.createWritable();await w.write(text);await w.close();return true;}catch(e){return false;}})();}
function fsEnsurePerm(ask){return (async function(){if(!dirHandle)return false;try{var o={mode:"readwrite"};if((await dirHandle.queryPermission(o))==="granted")return true;if(ask&&(await dirHandle.requestPermission(o))==="granted")return true;return false;}catch(e){return false;}})();}
function writeBackup(dated,ask){return (async function(){if(!dirHandle)return false;if(!(await fsEnsurePerm(ask)))return false;var text=JSON.stringify(S,null,2);var ok=await fsWrite("KA-billing-latest.json",text);if(dated)await fsWrite("KA-billing-"+stamp()+".json",text);return ok;})();}

function restoreDatedDialog(){return (async function(){
  if(!dirHandle){toast("Connect a backup folder first");return;}

  var files=[];try{for await(var entry of dirHandle.values()){if(entry.kind==="file"&&/^KA-billing-\d{4}-\d{2}-\d{2}\.json$/.test(entry.name))files.push(entry.name);}}catch(e){toast("Could not read the folder");return;}
  files.sort().reverse();
  if(!files.length){openModal('<h3>Restore a dated backup</h3><div class="empty">No dated backups found in the folder yet. They are written when you close the app.</div><div class="actions"><button class="btn primary" id="rdClose">Close</button></div>');$("#rdClose").onclick=closeModal;return;}
  var rows=files.slice(0,60).map(function(f){var dm=f.match(/(\d{4})-(\d{2})-(\d{2})/);var lbl=dm?(dm[3]+"/"+dm[2]+"/"+dm[1]):f;return '<div class="listrow"><div class="grow"><b>'+lbl+'</b><div class="hint">'+esc(f)+'</div></div><button class="btn sm warn" data-rf="'+esc(f)+'">Restore</button></div>';}).join("");
  openModal('<h3>Restore a dated backup</h3><p class="hint" style="margin-top:4px">Pick a day to roll back to. This replaces everything currently in the app.</p><div style="margin-top:12px;max-height:46vh;overflow:auto">'+rows+'</div><div class="actions"><button class="btn primary" id="rdClose">Close</button></div>',true);
  $("#rdClose").onclick=closeModal;
  $$("#modalBox [data-rf]").forEach(function(b){b.onclick=function(){var fname=b.getAttribute("data-rf");confirmDlg({title:"Restore "+fname+"?",body:"This replaces all current data with that day's backup.",ok:"Restore",danger:true}).then(function(ok){if(ok)doRestoreDated(fname);});};});
})();}
function doRestoreDated(fname){return (async function(){try{var fh=await dirHandle.getFileHandle(fname);var file=await fh.getFile();var text=await file.text();var data=JSON.parse(text);if(!data||!data.settings||!Array.isArray(data.bills)){toast("That file is not a valid backup");return;}S=migrate(data);save();refreshBrand();closeModal();toast("Restored "+fname);show("bill");}catch(e){toast("Could not restore that file");}})();}

function kbRow(k,d){return '<div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><kbd style="font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12.5px;white-space:nowrap">'+k+'</kbd><span style="color:var(--muted);text-align:right">'+d+'</span></div>';}
function showShortcuts(){
  openModal('<h3>Keyboard shortcuts</h3><p class="hint" style="margin-top:4px">Bill a whole sale without the mouse.</p><div class="col" style="gap:8px;margin-top:14px;font-size:14px">'+
    kbRow("Type","Search for a product")+kbRow("↑ / ↓","Move through the results")+kbRow("Enter","Open the highlighted item")+kbRow("A500, Enter","In the item box: set code + MRP, then add")+kbRow("Esc","Close / cancel")+kbRow("F2  or  Ctrl+Enter","Save &amp; print the bill")+kbRow("F3","Jump back to the product search")+kbRow("F9","Reprint the last bill")+kbRow("Alt + 1 … 8","Switch tabs")+
  '</div><div class="actions"><button class="btn primary" id="ksClose">Got it</button></div>');
  $("#ksClose").onclick=closeModal;
}
document.addEventListener("keydown",function(e){
  var rcOpen=!$("#receiptOverlay").hidden, mdOpen=!$("#modalOverlay").hidden;
  if(e.key==="Escape"){
    if(rcOpen){$("#receiptOverlay").hidden=true;var p1=$("#prodSearch");if(p1&&!$("#tab-bill").hidden)p1.focus();e.preventDefault();return;}
    if(mdOpen){var c=$('#modalBox [data-r="0"]')||$("#modalBox #dCancel")||$("#modalBox #fCancel")||$("#modalBox #ksClose")||$("#modalBox #fClose")||$("#modalBox #hClose")||$("#modalBox #bfClose")||$("#modalBox #rdClose")||$("#modalBox #rtCancel")||$("#modalBox #hlCancel")||$("#modalBox #cxOk");if(c)c.click();else closeModal();e.preventDefault();return;}
    return;
  }
  if(rcOpen||mdOpen)return;
  if(e.key==="F2"||(e.ctrlKey&&e.key==="Enter")){if(!$("#tab-bill").hidden)saveBill();e.preventDefault();return;}
  if(e.key==="F3"){show("bill");var ps=$("#prodSearch");if(ps){ps.focus();ps.select();}e.preventDefault();return;}
  if(e.key==="F9"){reprintLast();e.preventDefault();return;}
  var t=e.target||{},typing=(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA"||t.isContentEditable);
  if(!typing&&(e.key==="?"||(e.shiftKey&&e.key==="/"))){showShortcuts();e.preventDefault();return;}
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&/^[1-8]$/.test(e.key)){show(TABS[+e.key-1]);e.preventDefault();return;}
});

/* ===================== boot ===================== */
loadDraft();
$("#modalOverlay").addEventListener("click",function(e){if(e.target===this)closeModal();});
$("#keysBtn").onclick=showShortcuts;
if(fsSupported){idbGetHandle().then(function(h){if(h){dirHandle=h;if(!$("#tab-settings").hidden&&renderers.settings)renderers.settings();}});}
refreshBrand();show("bill");
})();
</script>
</body>
</html>
